<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentia — Piste B · Chaleureuse &amp; Terroir</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Cadre smartphone : simple décor de présentation (390 × 844) -->
  <div class="phone">
    <div class="app" id="app">

      <header class="masthead" id="masthead"></header>
      <main class="view" id="view" tabindex="-1"></main>
      <nav class="tabbar" id="tabbar" aria-label="Navigation principale"></nav>

      <!-- Calques : onboarding, fiche détail, feuilles modales -->
      <div class="layer" id="layer-onboarding" hidden></div>
      <div class="layer" id="layer-detail" hidden></div>
      <div class="layer" id="layer-sheet" hidden></div>
      <div class="splash" id="splash" hidden></div>

    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
